name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flecha/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: flecha

      - name: Typecheck
        run: npm run typecheck
        working-directory: flecha

      - name: Build shell extension
        run: npm run shell:build
        working-directory: flecha

      - name: Run tests
        run: npm test
        working-directory: flecha
